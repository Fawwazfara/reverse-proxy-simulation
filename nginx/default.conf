# Tolak koneksi ke IP langsung atau domain tidak dikenal
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# HTTP: izinkan jalur renew Certbot, sisanya redirect ke HTTPS
server {
    listen 80;
    server_name laravel.wac.web.id node.wac.web.id go.wac.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Laravel
server {
    listen 443 ssl;
    http2 on;
    server_name laravel.wac.web.id;

    ssl_certificate     /etc/letsencrypt/live/wac-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wac-apps/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app-laravel:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

