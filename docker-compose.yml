services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"                  # satu-satunya port yang terbuka ke host
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app-laravel
      - app-node
      - app-go
    networks:            # Nginx ikut 3 network, supaya bisa menjangkau ketiga app
      - laravel-proxy
      - node-proxy
      - go-proxy
      - grafana-proxy
    mem_limit: 64m

  certbot:
    image: certbot/certbot
    profiles: ["tools"]          # tidak ikut jalan saat 'up', hanya dipanggil manual
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
  app-laravel:
    build: ./app-laravel
    container_name: app-laravel
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: laraveldb
      DB_USERNAME: laravel_user
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel-proxy
      - laravel-db
    mem_limit: 256m

  app-node:
    build: ./app-node
    container_name: app-node
    restart: unless-stopped
    init: true                   # proses init kecil supaya SIGTERM tertangani
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MONGO_URI: mongodb://nodeadmin:${MONGO_PASSWORD}@mongodb:27017/nodedb?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - node-proxy
      - node-cache
      - node-db
    mem_limit: 192m

  app-go:
    build: ./app-go
    container_name: app-go
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: godb_user
      DB_PASSWORD: ${GO_DB_PASSWORD}
      DB_NAME: godb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - go-proxy
      - go-db
    mem_limit: 64m

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: godb_user
      POSTGRES_PASSWORD: ${GO_DB_PASSWORD}
      POSTGRES_DB: godb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godb_user -d godb"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - go-db
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - node-cache
    mem_limit: 96m

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]   # batasi cache internal Mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: nodeadmin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" -u nodeadmin -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - node-db
    mem_limit: 512m

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=30
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: laraveldb
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - laravel-db
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d       # simpan data 7 hari saja
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - monitoring
    mem_limit: 192m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    mem_limit: 32m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    mem_limit: 128m

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.wac.web.id
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus
    networks:
      - monitoring
      - grafana-proxy
    mem_limit: 192m

networks:
  laravel-proxy:
  node-proxy:
  go-proxy:
  go-db:
    internal: true
  node-cache:
    internal: true
  node-db:
    internal: true
  laravel-db:
    internal: true
  monitoring:
    internal: true
  grafana-proxy:

volumes:
  pgdata:
  redisdata:
  mongodata:
  mysqldata:
  promdata:
  grafanadata:
