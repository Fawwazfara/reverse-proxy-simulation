services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"                  # satu-satunya port yang terbuka ke host
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app-laravel
      - app-node
      - app-go
    networks:            # Nginx ikut 3 network, supaya bisa menjangkau ketiga app
      - laravel-proxy
      - node-proxy
      - go-proxy
    mem_limit: 64m

  certbot:
    image: certbot/certbot
    profiles: ["tools"]          # tidak ikut jalan saat 'up', hanya dipanggil manual
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
  app-laravel:
    build: ./app-laravel
    container_name: app-laravel
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - laravel-proxy
    mem_limit: 256m

  app-node:
    build: ./app-node
    container_name: app-node
    restart: unless-stopped
    init: true                   # proses init kecil supaya SIGTERM tertangani
    networks:
      - node-proxy
    mem_limit: 128m

  app-go:
    build: ./app-go
    container_name: app-go
    restart: unless-stopped
    networks:
      - go-proxy
    mem_limit: 64m

networks:
  laravel-proxy:
  node-proxy:
  go-proxy:
