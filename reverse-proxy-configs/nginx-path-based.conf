# ========================================================
# Contoh Konfigurasi Reverse Proxy Nginx Berbasis Path URL
# ========================================================
# Akses semua lewat port 80 dengan path berbeda:
# - http://localhost/laravel/ -> Port 8001
# - http://localhost/node/    -> Port 8002
# - http://localhost/go/      -> Port 8003
# ========================================================

server {
    listen 80;
    server_name localhost;

    # 1. Laravel Reverse Proxy
    location /laravel/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Node.js Reverse Proxy
    location /node/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Go Reverse Proxy
    location /go/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

